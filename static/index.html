<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siapkan klip untuk Omni</title>
<style>
:root{--ink:#12151a;--panel:#1b1f26;--line:#2b313b;--text:#e9e7e2;--muted:#9aa1ac;--accent:#4fd1c5;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 32px;max-width:60ch}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
h2{font-size:1.1rem;margin:0 0 12px;font-weight:600}
label.drop{display:block;border:1.5px dashed var(--line);border-radius:8px;padding:48px 20px;text-align:center;cursor:pointer;color:var(--muted)}
label.drop:hover,label.drop:focus-within{border-color:var(--accent);color:var(--text)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.stage{position:relative;display:inline-block;line-height:0;border-radius:6px;overflow:hidden;cursor:crosshair;max-width:100%}
.stage img{max-width:100%;max-height:68vh;display:block}
#mark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:2px solid var(--accent);border-radius:50%;box-shadow:0 0 0 2px #000a,inset 0 0 0 2px #000a;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin-top:18px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
input[type=number],select{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;width:120px}
button,a.btn{background:var(--accent);color:#04201d;border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--muted);margin:12px 0 0;min-height:1.5em}
.warn{color:#f2c94c}.err{color:var(--bad);white-space:pre-wrap}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.vids figure{margin:0}.vids figcaption{color:var(--muted);font-size:.9rem;margin-bottom:6px}
video{width:100%;border-radius:6px;background:#000}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Siapkan klip untuk Omni</h1>
<p class="lead">Unggah klip, klik orang yang mau diganti, lalu unduh video dengan depth hanya di badan orang dan latar tetap asli.</p>

<section id="s-upload">
  <h2>Unggah klip</h2>
  <label class="drop">Pilih video (MP4, MOV, WebM), idealnya 10 detik atau kurang
    <input id="file" type="file" accept="video/*"></label>
  <p id="up-msg" class="msg" role="status"></p>
</section>

<section id="s-pick" hidden>
  <h2>Klik badan orang yang mau diganti</h2>
  <div class="stage" id="stage"><img id="frame" alt="Frame pertama klip"><div id="mark" hidden></div></div>
  <p id="info" class="msg"></p>
  <div class="row">
    <label class="field">Perbesar mask<input id="dilate" type="number" min="0" max="30" value="6"></label>
    <label class="field">Haluskan tepi<input id="feather" type="number" min="0" max="15" value="3"></label>
    <label class="field">Warna depth<select id="cmap"><option>inferno</option><option>turbo</option><option>viridis</option><option>jet</option></select></label>
    <button id="go" disabled>Proses di GPU</button>
    <button id="reset" class="ghost">Ganti klip</button>
  </div>
  <p id="err" class="msg err" role="alert"></p>
</section>

<section id="s-run" hidden>
  <h2 id="stagetxt">Menunggu GPU</h2>
  <p class="msg">Jangan tutup halaman ini. Prosesnya biasanya beberapa menit.</p>
  <div class="bar"><i></i></div>
</section>

<section id="s-done" hidden>
  <h2>Selesai</h2>
  <div class="vids">
    <figure><figcaption>Mask (periksa sampai habis: lubang, tepi, latar yang ikut)</figcaption><video id="vmask" controls loop muted playsinline></video></figure>
    <figure><figcaption>Hasil untuk diunggah ke Omni</figcaption><video id="vcomp" controls loop muted playsinline></video></figure>
  </div>
  <div class="row">
    <a id="dl" class="btn" download="composite.mp4">Unduh composite.mp4</a>
    <button id="again" class="ghost">Atur ulang titik atau pengaturan</button>
    <button id="new" class="ghost">Klip baru</button>
  </div>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const show=id=>["s-upload","s-pick","s-run","s-done"].forEach(k=>$("#"+k).hidden=k!==id);
let job=null,pt=null;

$("#file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const fd=new FormData(); fd.append("file",f);
  const x=new XMLHttpRequest(); x.open("POST","/api/upload");
  x.upload.onprogress=ev=>{ if(ev.lengthComputable){ const p=Math.round(ev.loaded/ev.total*100); $("#up-msg").textContent=p<100?`Mengunggah ${p}%`:"Mengekstrak frame…"; } };
  x.onload=()=>{ let j={}; try{j=JSON.parse(x.responseText)}catch(_){}
    if(x.status===200){ job=j; showPick(); } else $("#up-msg").textContent=j.detail||"Gagal mengunggah."; };
  x.onerror=()=>$("#up-msg").textContent="Koneksi terputus saat mengunggah.";
  $("#up-msg").textContent="Mengunggah…"; x.send(fd);
});

function showPick(){
  pt=null; $("#mark").hidden=true; $("#go").disabled=true; $("#err").textContent="";
  $("#frame").src=job.frame_url+"?t="+Date.now();
  const long=job.seconds>10;
  $("#info").innerHTML=`${job.seconds} detik, ${job.width}×${job.height}. Belum ada titik.`+(long?` <span class="warn">Lebih dari 10 detik: Omni hanya menerima 10 detik. Potong dulu.</span>`:"");
  show("s-pick");
}

$("#stage").addEventListener("click",e=>{
  const r=$("#frame").getBoundingClientRect();
  const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
  pt={x:Math.round(fx*job.width),y:Math.round(fy*job.height)};
  const m=$("#mark"); m.hidden=false; m.style.left=fx*100+"%"; m.style.top=fy*100+"%";
  $("#go").disabled=false;
  $("#info").textContent=`${job.seconds} detik, ${job.width}×${job.height}. Titik: ${pt.x}, ${pt.y}.`;
});

$("#go").addEventListener("click",async()=>{
  $("#err").textContent="";
  const r=await fetch(`/api/jobs/${job.id}/start`,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({x:pt.x,y:pt.y,dilate:+$("#dilate").value,feather:+$("#feather").value,colormap:$("#cmap").value})});
  if(!r.ok){ $("#err").textContent=(await r.json()).detail||"Gagal memulai."; return; }
  show("s-run"); poll();
});

async function poll(){
  let j; try{ const r=await fetch(`/api/jobs/${job.id}`); if(!r.ok) throw 0; j=await r.json(); }
  catch(_){ $("#stagetxt").textContent="Terputus dari server. Mencoba lagi…"; return setTimeout(poll,3000); }
  if(j.state==="done"){
    $("#vmask").src=j.mask; $("#vcomp").src=j.composite; $("#dl").href=j.composite; show("s-done");
  } else if(j.state==="error"){
    $("#err").textContent="Gagal: "+j.error; show("s-pick");
  } else { $("#stagetxt").textContent=j.stage||"Menunggu GPU"; setTimeout(poll,2000); }
}

$("#again").addEventListener("click",()=>{ $("#vmask").pause(); $("#vcomp").pause(); showPick(); });
const fresh=async()=>{ if(job) await fetch(`/api/jobs/${job.id}`,{method:"DELETE"}); job=null; $("#file").value=""; $("#up-msg").textContent=""; show("s-upload"); };
$("#reset").addEventListener("click",fresh); $("#new").addEventListener("click",fresh);
</script>
</body>
</html>
