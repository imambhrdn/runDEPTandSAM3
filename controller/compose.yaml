services:
  controller:
    image: controller-controller:terminal
    build:
      context: ..
      dockerfile: controller/Dockerfile
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - jobs:/data
      - /home/ubuntu/.modal.toml:/home/app/.modal.toml:ro
    networks:
      - app
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  9router:
    image: decolua/9router:latest
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      INITIAL_PASSWORD: ${INITIAL_PASSWORD}
    volumes:
      - /home/ubuntu/.9router:/app/data
    networks:
      - app
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app
    depends_on:
      - controller
networks:
  app:
volumes:
  jobs:
  caddy_data:
  caddy_config:
