<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame Lab</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><strong>frame<span>lab</span></strong><nav aria-label="Studio"><a href="/modal">Modal</a><a href="/hf">Hugging Face</a><span id="balance">Saldo —</span></nav></header>
<main>
<section aria-labelledby="upload-title">
  <h1 id="upload-title">Upload video</h1>
  <p>Pilih hingga 8 video. Pilih subjek pada frame pertama setiap video, lalu proses semuanya dengan satu GPU.</p>
  <label class="upload">Pilih video<input id="file" type="file" multiple accept=".mp4,.mov,.m4v,.webm,.mkv"></label>
  <p id="limits"></p><p id="upload-status" role="status"></p><p id="error" role="alert"></p>
  <div id="queue" aria-label="Antrean video"></div>
  <div id="pick" hidden>
    <h2 id="selected-name">Pilih subjek</h2>
    <div id="stage" tabindex="0" role="button" aria-label="Pilih subjek. Enter memilih tengah; tombol panah menggeser titik.">
      <img id="frame" alt="Frame pertama video"><video id="source-video" muted playsinline preload="metadata" hidden></video><span id="mark" hidden></span>
    </div>
    <div class="timeline"><input id="timeline" aria-label="Posisi video" type="range" min="0" max="0" step="0.01" value="0" disabled><button id="first" type="button">Frame pertama</button></div>
    <p id="point">Klik subjek pada frame pertama.</p>
  </div>
  <button id="start" disabled>Proses antrean · 1 GPU</button>
  <p id="rental-note"></p>
</section>
<section aria-labelledby="results-title"><h2 id="results-title">Hasil</h2><p id="empty">Hasil video muncul di sini setelah diproses.</p><div id="results"></div></section>
</main>
<script src="/static/app.js" defer></script>
</body></html>
